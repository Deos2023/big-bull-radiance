<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5BA38" />
      <stop offset="50%" stop-color="#E5A826" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Golden Rounded Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#goldGradient)" filter="url(#subtleGlow)" />

  <!-- Inner Soft Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FDE68A" stroke-width="8" stroke-opacity="0.4" />

  <!-- Lucide-style TrendingUp Icon in Deep Navy -->
  <!-- Scaled precisely to match Navbar logo -->
  <g fill="none" stroke="#091322" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trend Line -->
    <polyline points="436,166 283,319 193,229 76,346" stroke-width="44" />
    <!-- Arrow Head -->
    <polyline points="328,166 436,166 436,274" stroke-width="44" />
  </g>
</svg>